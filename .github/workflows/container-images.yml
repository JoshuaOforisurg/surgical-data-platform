name: Container images

on:
  pull_request:
    paths:
      - ".github/workflows/container-images.yml"
      - "platform/modules/operational/**/Dockerfile*"
      - "platform/modules/operational/**/requirements.txt"
      - "platform/modules/operational/**/pyproject.toml"
      - "platform/modules/operational/**/poetry.lock"
      - "platform/modules/operational/**/**/*.py"
      - "platform/shared/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-images.yml"
      - "platform/modules/operational/**/Dockerfile*"
      - "platform/modules/operational/**/requirements.txt"
      - "platform/modules/operational/**/pyproject.toml"
      - "platform/modules/operational/**/poetry.lock"
      - "platform/modules/operational/**/**/*.py"
      - "platform/shared/**"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: surgeon-preference-app
            dockerfile: ./platform/modules/operational/surgeon_preference/Dockerfile
          - image: surgeon-preference-job
            dockerfile: ./platform/modules/operational/surgeon_preference/Dockerfile.job
          - image: stock-inventory-app
            dockerfile: ./platform/modules/operational/stock_inventory/Dockerfile
          - image: stock-inventory-job
            dockerfile: ./platform/modules/operational/stock_inventory/Dockerfile.job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${repo}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_images) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
