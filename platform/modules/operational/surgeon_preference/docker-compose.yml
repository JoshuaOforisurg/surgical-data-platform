services:
  surgeon_pipeline:
    build: .
    container_name: surgeon_preference_pipeline
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
    command: python main_orchestrator.py
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy

  streamlit_app:
    build: .
    container_name: surgeon_streamlit_ui
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address=0.0.0.0
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      surgeon_pipeline:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      # FIXED: Removed '127.0.0.1:' prefixing to open up all interface meshes safely
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    container_name: surgeon_preference_postgres
    ports:
      - "${HOST_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  minio_data:
  postgres_data:
